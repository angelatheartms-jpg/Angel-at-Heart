<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Angel at Heart Charity</title>
</head>
<body>
    <header>
        <h1>Welcome to Angel at Heart Charity</h1>
        <section id="hero">
            <h2>Making a Difference</h2>
        </section>
    </header>
    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>Angel at Heart is dedicated to supporting those in need.</p>
        </section>
        <section id="mission">
            <h2>Our Mission</h2>
            <p>To bring hope and help to the underprivileged in our community.</p>
        </section>
        <section id="donate">
            <h2>Support Us</h2>
            <p>Your donations make a difference!</p>
            <button onclick="window.location.href='donate.html'">Donate Now</button>
            <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
                <input type="hidden" name="cmd" value="_donations">
                <input type="hidden" name="business" value="your_paypal_email@example.com">
                <input type="hidden" name="item_name" value="Donation to Angel at Heart Charity">
                <input type="hidden" name="currency_code" value="USD">
                <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_donate_LG.gif" alt="Donate with PayPal">
            </form>
            <button onclick="window.location.href='https://zellepay.com'">Donate via Zelle</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Angel at Heart Charity</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
